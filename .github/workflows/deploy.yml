name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        run: |
          missing=0
          [ -z "${{ secrets.SSH_HOST }}" ] && echo "❌ 缺少 Secret: SSH_HOST（填 111.229.212.20）" && missing=1
          [ -z "${{ secrets.SSH_USER }}" ] && echo "❌ 缺少 Secret: SSH_USER（填 root）" && missing=1
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && [ -z "${{ secrets.SSH_PASSWORD }}" ]; then
            echo "❌ 缺少 Secret: SSH_PASSWORD 或 SSH_PRIVATE_KEY（二选一）"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "请到 Settings → Secrets and variables → Actions → Repository secrets 添加"
            exit 1
          fi
          echo "✅ Secrets 已配置，开始部署..."

      - name: Deploy to Tencent Cloud via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            WEB_ROOT="/var/www/html"
            BACKUP_DIR="/var/www/backup/$(date +%Y%m%d_%H%M%S)"
            sudo mkdir -p "$BACKUP_DIR" /var/www/backup
            if [ -d "$WEB_ROOT" ] && [ "$(sudo ls -A "$WEB_ROOT" 2>/dev/null)" ]; then
              sudo cp -r "$WEB_ROOT"/* "$BACKUP_DIR"/ 2>/dev/null || true
              echo "Backup: $BACKUP_DIR"
            fi
            cd "$WEB_ROOT"
            sudo git fetch origin main
            sudo git reset --hard origin/main
            echo "Deployed: $(git log -1 --oneline)"
            # 恢复 git 仓库外的工具（如 SmartCS），避免自动部署覆盖
            if [ ! -d "$WEB_ROOT/tools/smartcs-coldstart" ] || [ -z "$(sudo ls -A "$WEB_ROOT/tools/smartcs-coldstart" 2>/dev/null)" ]; then
              echo "SmartCS missing, searching backups..."
              for b in $(sudo ls -t /var/www/backup/ 2>/dev/null); do
                if [ -d "/var/www/backup/$b/tools/smartcs-coldstart" ]; then
                  sudo mkdir -p "$WEB_ROOT/tools"
                  sudo cp -r "/var/www/backup/$b/tools/smartcs-coldstart" "$WEB_ROOT/tools/"
                  echo "Restored smartcs-coldstart from backup $b"
                  break
                fi
                if [ -d "/var/www/backup/$b/tools/smartcs-v3" ]; then
                  sudo mkdir -p "$WEB_ROOT/tools/smartcs-coldstart"
                  sudo cp -r "/var/www/backup/$b/tools/smartcs-v3/"* "$WEB_ROOT/tools/smartcs-coldstart/" 2>/dev/null || \
                  sudo cp -r "/var/www/backup/$b/tools/smartcs-v3" "$WEB_ROOT/tools/smartcs-coldstart"
                  echo "Restored smartcs-v3 as smartcs-coldstart from backup $b"
                  break
                fi
              done
            fi
            echo "Tools on server:"
            sudo ls -la "$WEB_ROOT/tools/" 2>/dev/null || true
            cd /var/www/backup/ && sudo ls -t | tail -n +6 | xargs -r sudo rm -rf || true
