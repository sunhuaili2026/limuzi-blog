name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Tencent Cloud via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            WEB_ROOT="/var/www/html"
            BACKUP_DIR="/var/www/backup/$(date +%Y%m%d_%H%M%S)"
            mkdir -p "$BACKUP_DIR" /var/www/backup
            if [ -d "$WEB_ROOT" ] && [ "$(ls -A "$WEB_ROOT" 2>/dev/null)" ]; then
              cp -r "$WEB_ROOT"/* "$BACKUP_DIR"/ 2>/dev/null || true
              echo "Backup: $BACKUP_DIR"
            fi
            cd "$WEB_ROOT"
            git fetch origin main
            git reset --hard origin/main
            echo "Deployed: $(git log -1 --oneline)"
            cd /var/www/backup/ && ls -t | tail -n +6 | xargs -r rm -rf || true
