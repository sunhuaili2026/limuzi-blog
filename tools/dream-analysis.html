<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦境解析 - 李子木</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .dream-tool {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .dream-input-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
        }
        
        .dream-input {
            width: 100%;
            min-height: 180px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s ease;
        }
        
        .dream-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        
        .dream-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .dream-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex: 0 0 auto;
        }
        
        .dream-action-btn:hover {
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }
        
        .dream-action-btn.primary {
            background: var(--accent-gradient);
            border: none;
        }
        
        .dream-action-btn.primary:hover {
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.4);
        }
        
        .dream-action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 结果区域样式 */
        .dream-result {
            margin-top: 32px;
            display: none;
        }
        
        .dream-result.active {
            display: block;
            animation: fadeInUp 0.6s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 核心主题卡片 */
        .theme-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        
        .theme-card::before {
            content: '🔮';
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 80px;
            opacity: 0.1;
        }
        
        .theme-label {
            font-size: 12px;
            color: var(--accent-primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        
        .theme-content {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        /* 板块卡片 */
        .section-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .section-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .section-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .section-icon.purple { background: rgba(168, 85, 247, 0.15); }
        .section-icon.blue { background: rgba(59, 130, 246, 0.15); }
        .section-icon.green { background: rgba(34, 197, 94, 0.15); }
        .section-icon.orange { background: rgba(249, 115, 22, 0.15); }
        
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        /* 元素解析网格 */
        .elements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }
        
        .element-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            border-left: 3px solid var(--accent-primary);
        }
        
        .element-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .element-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        /* 列表项 */
        .insight-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .insight-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .insight-item:last-child {
            border-bottom: none;
        }
        
        .insight-bullet {
            min-width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-primary);
            margin-top: 8px;
        }
        
        .insight-text {
            color: var(--text-secondary);
            line-height: 1.7;
            flex: 1;
        }
        
        /* 建议卡片 */
        .suggestion-card {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.08) 0%, rgba(16, 185, 129, 0.08) 100%);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }
        
        .suggestion-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .suggestion-item:last-child {
            margin-bottom: 0;
        }
        
        .suggestion-icon {
            font-size: 16px;
            margin-top: 2px;
        }
        
        .suggestion-text {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        /* 情绪标签 */
        .emotion-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        
        .emotion-tag {
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .emotion-tag.positive {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }
        
        .emotion-tag.neutral {
            background: rgba(107, 114, 128, 0.15);
            color: #6b7280;
        }
        
        .emotion-tag.negative {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        
        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .loading-state .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }
        
        .loading-state p {
            color: var(--text-secondary);
            font-size: 15px;
        }
        
        /* 图片/视频结果 */
        .media-result {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }
        
        .media-prompt {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            word-break: break-word;
        }
        
        .media-tip {
            margin-top: 16px;
            padding: 16px;
            background: rgba(99, 102, 241, 0.1);
            border-left: 4px solid var(--accent-primary);
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .media-tip strong {
            color: var(--text-primary);
            display: block;
            margin-bottom: 8px;
        }
        
        .media-tip ul {
            margin: 0;
            padding-left: 20px;
            line-height: 2;
        }
    </style>
</head>

    <!-- Page Header -->
    <section class="page-header" style="padding: 120px 0 40px;">
        <div class="container">
            <span class="section-label">AI 工具</span>
            <h1 class="page-title" style="font-size: 36px; margin-bottom: 12px;">🌙 梦境解析</h1>
            <p class="page-subtitle" style="font-size: 16px; color: var(--text-secondary);">探索梦境的奥秘，解析潜意识，生成梦境视觉化内容</p>

    <section class="section" style="padding-top: 0;">
        <div class="container">

                <div class="dream-input-section">
                    <h2 style="margin-bottom: 16px; font-size: 18px; font-weight: 600;">描述你的梦境</h2>
                    <textarea 
                        class="dream-input" 
                        id="dreamInput"
                        placeholder="请详细描述你做的梦，包括场景、人物、情节、感受等。例如：

我梦见自己在一个古老的城堡里，周围弥漫着紫色的雾气。我穿着白色的长裙，手里拿着一把发光的钥匙。城堡里有很多镜子，每个镜子里都有一个不同的我。我想找到出口，但每次打开门都会回到同一个房间..."

    <script src="../script.js"></script>
    <script>
        const API_KEY = 'limuzi2025';
        let currentDream = '';

        async function callAPI(messages, model = 'deepseek-chat') {
            const response = await fetch('/api/deepseek', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    password: API_KEY,
                    model: model,
                    messages: messages,
                    temperature: 0.7
                })
            });
            
            if (!response.ok) {
                throw new Error('API 调用失败');
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
        }

        // 解析 JSON 响应
        function parseDreamResponse(content) {
            try {
                // 尝试提取 JSON
                const jsonMatch = content.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    return JSON.parse(jsonMatch[0]);
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        // 渲染结果
        function renderResult(data) {
            const resultDiv = document.getElementById('dreamResult');
            
            // 核心主题
            if (data.theme) {
                document.getElementById('themeContent').textContent = data.theme;
                document.getElementById('themeCard').style.display = 'block';
            }
            
            // 关键元素
            if (data.elements && data.elements.length > 0) {
                const grid = document.getElementById('elementsGrid');
                grid.innerHTML = data.elements.map(el => `
                    <div class="element-item">
                        <div class="element-name">
                            <span>•</span>
                            ${el.name}
                        </div>
                        <div class="element-desc">${el.meaning}</div>
                    </div>
                `).join('');
                document.getElementById('elementsCard').style.display = 'block';
            }
            
            // 潜意识信息
            if (data.subconscious && data.subconscious.length > 0) {
                const list = document.getElementById('subconsciousList');
                list.innerHTML = data.subconscious.map(item => `
                    <li class="insight-item">
                        <div class="insight-bullet"></div>
                        <div class="insight-text">${item}</div>
                    </li>
                `).join('');
                document.getElementById('subconsciousCard').style.display = 'block';
            }
            
            // 情绪标签
            if (data.emotions && data.emotions.length > 0) {
                const tags = document.getElementById('emotionTags');
                tags.innerHTML = data.emotions.map(emotion => {
                    const type = emotion.type || 'neutral';
                    return `<span class="emotion-tag ${type}">${emotion.emoji || ''} ${emotion.name}</span>`;
                }).join('');
            }
            
            // 现实关联
            if (data.reality && data.reality.length > 0) {
                const list = document.getElementById('realityList');
                list.innerHTML = data.reality.map(item => `
                    <li class="insight-item">
                        <div class="insight-bullet"></div>
                        <div class="insight-text">${item}</div>
                    </li>
                `).join('');
                document.getElementById('realityCard').style.display = 'block';
            }
            
            // 建议与启示
            if (data.suggestions && data.suggestions.length > 0) {
                const content = document.getElementById('suggestionContent');
                content.innerHTML = data.suggestions.map(sug => `
                    <div class="suggestion-item">
                        <div class="suggestion-icon">${sug.emoji || '💡'}</div>
                        <div class="suggestion-text">${sug.text}</div>
                    </div>
                `).join('');
                document.getElementById('suggestionCard').style.display = 'block';
            }
            
            resultDiv.classList.add('active');
        }

        async function analyzeDream() {
            const input = document.getElementById('dreamInput').value.trim();
            if (!input) {
                alert('请先描述你的梦境');
                return;
            }
            
            currentDream = input;
            
            // 显示加载状态
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('dreamResult').classList.remove('active');
            document.getElementById('dreamResult').style.display = 'none';
            
            const btn = event.target.closest('button');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> 正在解析...';
            
            try {
                const result = await callAPI([
                    {
                        role: 'system',
                        content: `你是一位资深梦境解析师，融合荣格心理学、精神分析和现代神经科学的专业知识。

**重要：请以 JSON 格式返回解析结果**，格式如下：

{
  "theme": "一句话概括梦境核心主题",
  "elements": [
    {"name": "元素名称", "meaning": "象征意义解释"}
  ],
  "subconscious": ["潜意识信息点 1", "信息点 2", "信息点 3"],
  "emotions": [
    {"name": "情绪名称", "type": "positive|neutral|negative", "emoji": "😊"}
  ],
  "reality": ["现实关联点 1", "关联点 2"],
  "suggestions": [
    {"emoji": "🌱", "text": "具体建议 1"},
    {"emoji": "🧘", "text": "具体建议 2"}
  ]
}

要求：
- 用温暖、共情的语气
- 结合中国文化背景
- elements 3-5 个关键元素
- subconscious 2-4 个洞察点
- emotions 2-4 个情绪标签
- reality 2-3 个现实关联
- suggestions 2-4 条具体建议`
                    },
                    {
                        role: 'user',
                        content: `请解析这个梦境：${input}`
                    }
                ]);
                
                const data = parseDreamResponse(result);
                if (data) {
                    renderResult(data);
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('dreamResult').style.display = 'block';
                } else {
                    // 降级处理：显示原始文本
                    document.getElementById('themeContent').textContent = result;
                    document.getElementById('themeCard').style.display = 'block';
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('dreamResult').style.display = 'block';
                }
            } catch (error) {
                alert('解析失败，请重试');
                console.error(error);
                document.getElementById('loadingState').style.display = 'none';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>🔮</span><span>解析梦境</span>';
            }
        }

        async function generateImage() {
            const input = document.getElementById('dreamInput').value.trim() || currentDream;
            if (!input) {
                alert('请先描述你的梦境');
                return;
            }
            
            const btn = event.target.closest('button');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> 正在生成...';
            
            try {
                const prompt = await callAPI([
                    {
                        role: 'system',
                        content: '你将根据用户的梦境描述，生成一个详细的 AI 绘画提示词（英文）。提示词应该包含：场景、氛围、色彩、风格、细节等。格式：A surreal dream scene with [detailed description], [atmosphere], [color palette], [art style], highly detailed, dreamlike quality.'
                    },
                    {
                        role: 'user',
                        content: `请为这个梦境生成绘画提示词：${input}`
                    }
                ]);
                
                const resultDiv = document.getElementById('dreamResult');
                resultDiv.innerHTML = `
                    <div class="section-card">
                        <div class="section-header">
                            <div class="section-icon purple">🎨</div>
                            <div class="section-title">梦境绘画提示词</div>
                        </div>
                        <div class="media-result">
                            <div class="media-prompt">${prompt}</div>
                            <div class="media-tip">
                                <strong>💡 使用建议</strong>
                                <ul>
                                    <li>Midjourney: 复制提示词到 Discord</li>
                                    <li>DALL-E 3: 直接在 ChatGPT 中使用</li>
                                    <li>Stable Diffusion: 可添加额外参数调整风格</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
