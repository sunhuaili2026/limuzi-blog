<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务台 - AI客服冷启动系统</title>
    <link rel="stylesheet" href="../../style.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    
</head>
<body data-page="dashboard">
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="/index.html" class="nav-logo"><span class="logo-icon">◆</span><span class="logo-text">李子木</span></a>
            <ul class="nav-menu">
                <li><a href="/index.html" class="nav-link">首页</a></li>
                <li><a href="/blog.html" class="nav-link">博客</a></li>
                <li><a href="/tools.html" class="nav-link active">工具</a></li>
            </ul>
            <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
        </div>
    </nav>

    <section class="page-header" style="padding:110px 0 20px;">
        <div class="container sc-shell">
            <nav class="sc-subnav" aria-label="冷启动系统导航">
                <a href="index.html" class="active">任务台</a>
                <a href="create.html" class="">新建分析</a>
                <a href="task.html" class="">任务详情</a>
                <span class="spacer"></span>
                <a href="create.html" class="sc-btn primary inline" style="width:auto;padding:8px 14px;">+ 新建任务</a>
            </nav>
            <div class="sc-banner" id="globalBanner"></div>
            
            <div class="sc-page-hero">
                <div class="sc-breadcrumb"><a href="/tools.html">工具</a> / AI客服冷启动系统</div>
                <h1>任务台</h1>
                <p>在这里管理所有冷启动分析任务：查看进度、打开详情、导出客户报告。新建分析请进入独立页面，避免工作台拥挤。</p>
            </div>

            <div class="dash-stats">
                <div class="dash-stat"><div class="n" id="dashTotal">0</div><div class="l">全部任务</div></div>
                <div class="dash-stat"><div class="n" id="dashDone">0</div><div class="l">已完成</div></div>
                <div class="dash-stat"><div class="n" id="dashRunning">0</div><div class="l">进行中</div></div>
                <div class="dash-stat"><div class="n" id="dashFaqs">0</div><div class="l">累计 FAQ</div></div>
            </div>

            <div class="sc-panel">
                <div class="dash-head">
                    <h2>任务列表</h2>
                    <div class="page-actions">
                        <a class="sc-btn primary inline" href="create.html" style="width:auto;">新建分析</a>
                        <button class="sc-btn ghost danger" id="clearTasksBtn" type="button">清空历史</button>
                    </div>
                </div>
                <div id="taskTable" class="task-table"></div>
                <div class="sc-empty" id="taskListEmpty">
                    <strong>还没有分析任务</strong>
                    去「新建分析」上传对话 / FAQ，或载入示例跑通一次完整流程。
                    <div style="margin-top:14px;"><a class="sc-btn primary inline" href="create.html" style="width:auto;">开始新建分析</a></div>
                </div>
            </div>

        </div>
    </section>

    <footer class="footer">
        <div class="container"><div class="footer-bottom"><p>&copy; 2026 李子木</p></div></div>
    </footer>
    <div class="sc-toast" id="toast"></div>
    <script src="../../script.js"></script>
    <script src="app.js"></script>
</body>
</html>
