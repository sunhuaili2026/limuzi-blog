<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任务详情 · AI客服冷启动系统</title>
  <meta name="description" content="查看冷启动分析任务进度、结果与客户报告导出。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body data-page="detail">
  <a class="skip-link" href="#main">跳到主内容</a>
  <div class="app-shell">
    <aside class="app-sidebar" aria-label="主导航">
      <a class="app-brand" href="./index.html">
        <div class="app-brand-mark">CS</div>
        <div class="app-brand-text">
          <strong>AI客服冷启动</strong>
          <span>Cold Start Studio</span>
        </div>
      </a>
      <nav class="app-nav">
        <a href="./index.html"><span class="ico">◆</span>工作台</a>
        <a href="./create.html"><span class="ico">＋</span>新建分析</a>
        <a class="active" href="./task.html" aria-current="page"><span class="ico">▣</span>任务详情</a>
      </nav>
      <div class="app-side-block">
        <h4>最近任务</h4>
        <div class="recent-list" id="recentList"></div>
      </div>
      <div class="app-side-foot">
        <a href="./index.html">← 返回工作台</a>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div class="app-topbar-left">
          <div class="app-crumb"><a href="./index.html">工作台</a> / 任务详情</div>
          <h1 id="topbarTitle">任务详情</h1>
        </div>
        <div class="app-topbar-actions">
          <a class="sc-btn ghost" href="./index.html">工作台</a>
          <a class="sc-btn primary" href="./create.html">+ 新建分析</a>
        </div>
      </header>

      <main id="main" class="app-content">
        <div class="sc-banner" id="globalBanner"></div>

        <div id="detailEmpty" class="sc-empty" style="display:none;">
          <div class="empty-ico">?</div>
          <strong>未找到任务</strong>
          请返回工作台选择一个任务，或新建分析。
          <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
            <a class="sc-btn primary" href="./index.html">返回工作台</a>
            <a class="sc-btn" href="./create.html">新建分析</a>
          </div>
        </div>

        <div id="detailBody">
          <div class="detail-hero">
            <div>
              <div class="muted" id="detailId"></div>
              <h2 id="detailTitle">任务详情</h2>
            </div>
            <div class="detail-actions">
              <div id="detailStatus" class="task-status queued">queued</div>
              <a class="sc-btn ghost" href="./index.html">返回工作台</a>
              <a class="sc-btn" href="./create.html">再新建</a>
            </div>
          </div>

          <section class="sc-panel">
            <div class="sc-pipeline" id="pipeline">
              <div class="sc-step" data-step="parse"><div class="n">01</div><div class="t">对话解析</div><div class="d">清洗 / 统计</div></div>
              <div class="sc-step" data-step="scene"><div class="n">02</div><div class="t">场景挖掘</div><div class="d">意图 / 频次</div></div>
              <div class="sc-step" data-step="sop"><div class="n">03</div><div class="t">SOP 提炼</div><div class="d">可执行步骤</div></div>
              <div class="sc-step" data-step="faq"><div class="n">04</div><div class="t">FAQ + 相似问</div><div class="d">可导入知识</div></div>
              <div class="sc-step" data-step="review"><div class="n">05</div><div class="t">审核导出</div><div class="d">报告 / 资产</div></div>
            </div>
            <div class="sc-progress-bar"><div class="sc-progress-fill" id="progressFill"></div></div>
            <div class="sc-progress-meta">
              <span id="progressText">等待开始</span>
              <span id="progressPct">0%</span>
            </div>
            <div class="sc-hint" id="detailError" style="color:#fca5a5;"></div>
          </section>

          <section class="sc-panel" id="resultWrap" style="display:none;margin-top:16px;">
            <div class="sc-rtabs" id="resultTabs">
              <button class="sc-rtab active" type="button" data-pane="overview">总览</button>
              <button class="sc-rtab" type="button" data-pane="scenarios">场景</button>
              <button class="sc-rtab" type="button" data-pane="sops">SOP</button>
              <button class="sc-rtab" type="button" data-pane="faqs">FAQ</button>
              <button class="sc-rtab" type="button" data-pane="risks">风险点</button>
            </div>
            <div class="sc-toolbar">
              <button class="sc-btn" type="button" id="btnJson">下载 JSON</button>
              <button class="sc-btn" type="button" id="btnMd">下载 Markdown</button>
              <button class="sc-btn" type="button" id="btnCsv">下载 FAQ CSV</button>
              <button class="sc-btn" type="button" id="btnCopy">复制 FAQ</button>
              <button class="sc-btn accent" type="button" id="btnReport">导出客户报告</button>
              <button class="sc-btn ghost" type="button" id="btnPreviewReport">预览报告</button>
              <button class="sc-btn ghost" type="button" id="rerunBtn">重新运行</button>
            </div>
            <div class="pane active" id="pane-overview"></div>
            <div class="pane" id="pane-scenarios"></div>
            <div class="pane" id="pane-sops"></div>
            <div class="pane" id="pane-faqs"></div>
            <div class="pane" id="pane-risks"></div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div class="sc-toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
